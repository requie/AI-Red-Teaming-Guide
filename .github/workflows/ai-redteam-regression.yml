name: AI Red Team Regression

# Example baseline scan. It needs an OPENAI_API_KEY repository secret.
#
# The secret-bearing scan only runs on trusted events (push to main, manual
# dispatch). It never runs on pull_request: a PR could add files (e.g. a
# top-level garak.py) that Python would import ahead of the installed package
# and read the key. PRs get a skip notice instead.

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redteam-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice
        if: github.event_name == 'pull_request'
        run: echo "::notice::The example garak scan does not run on pull requests (secrets are never exposed to PR code). It runs on push to main and manual dispatch."

      - name: Set up Python
        if: github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install garak

      # Runs from an empty directory with no repository checkout, so nothing
      # from the repo can shadow the installed garak package.
      - name: Run baseline security scan (example)
        if: github.event_name != 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        working-directory: ${{ runner.temp }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::OPENAI_API_KEY secret not set; skipping the example garak scan."
            exit 0
          fi
          mkdir -p reports
          python -m garak --model_type openai --model_name gpt-4o-mini --report_prefix reports/garak

      - name: Upload reports
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-redteam-reports
          path: ${{ runner.temp }}/reports/
          if-no-files-found: ignore
